<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1c">
<meta name="description" content="players, stats and leaderboards">
<title>mc</title>
<link rel="preload" href="/fonts/regular.woff2" as="font" type="font/woff2" crossorigin>
<script src="/assets/theme.js"></script>
<link rel="stylesheet" href="/static/style.css?v=VERSION">
</head>
<body>
<button id="theme" class="btn" title="toggle theme"><svg width="16" height="16" viewBox="0 0 8 8" shape-rendering="crispEdges" fill="currentColor"><path d="M3 0h2v1H3zM3 7h2v1H3zM0 3h1v2H0zM7 3h1v2H7zM1 1h1v1H1zM6 1h1v1H6zM1 6h1v1H1zM6 6h1v1H6zM2 2h4v4H2z"/></svg></button>
<div class="p">
<nav class="pick" id="pick" hidden></nav>
<div id="card"></div>
<main id="home" hidden>
<div class="sec"><h2>online</h2><span class="d" id="ocount"></span></div>
<div id="online"></div>
<div class="sec"><h2>records</h2><span class="pick sm" id="scope"></span></div>
<div class="records" id="records"></div>
<div class="sec"><h2>leaderboard</h2><select class="btn" id="by"></select></div>
<div class="panel board" id="board"></div>
<div class="sec"><h2>players</h2><input class="field" id="find" type="search" placeholder="find"></div>
<div class="grid" id="players"></div>
<div class="sec"><h2>last 24 hours</h2><span class="d" id="peak"></span></div>
<div class="graph" id="graph"></div>
</main>
<main id="player" hidden></main>
<p class="empty" id="none" hidden>nothing here yet</p>
</div>
<script src="/static/app.js?v=VERSION"></script>
</body>
</html>
