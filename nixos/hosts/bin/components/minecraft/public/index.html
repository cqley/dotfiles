<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161616">
<meta name="description" content="players, stats and leaderboards">
<title>mc</title>
<link rel="icon" type="image/svg+xml" href="/assets/cat.svg">
<link rel="stylesheet" href="/assets/style.css">
<script>
try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t;}catch{}
</script>
<link rel="stylesheet" href="/static/style.css?v=VERSION">
</head>
<body>
<button id="theme" title="toggle theme"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
<div class="p">
<div class="seg" id="pick" hidden></div>
<div id="card"></div>
<main id="home" hidden>
<div class="sec"><h2>online</h2><span class="d" id="ocount"></span></div>
<div class="heads" id="online"></div>
<div class="sec"><h2>records</h2><span class="seg sm" id="scope"></span></div>
<div class="records" id="records"></div>
<div class="sec"><h2>leaderboard</h2><select class="f" id="by"></select></div>
<div class="board" id="board"></div>
<div class="sec"><h2>players</h2><input class="f" id="find" type="search" placeholder="find"></div>
<div class="grid" id="players"></div>
<div class="sec"><h2>last 24 hours</h2><span class="d" id="peak"></span></div>
<div class="graph" id="graph"></div>
</main>
<main id="player" hidden></main>
<p class="empty" id="none" hidden>nothing here yet</p>
</div>
<script src="/static/app.js?v=VERSION"></script>
</body>
</html>
