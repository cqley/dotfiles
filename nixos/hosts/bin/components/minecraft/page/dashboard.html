<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161616">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="silly">
<title>servers</title>
<link rel="apple-touch-icon" href="/app/icon180.png">
<link rel="manifest" href="/app/manifest.json">
<link rel="stylesheet" href="/assets/style.css">
<link rel="stylesheet" href="/static/style.css?v=VERSION">
<script src="/assets/theme.js"></script>
</head>
<body>
<div class="wrap">
<p class="top"><b>servers</b> <span id="total" class="dim"></span></p>
<ul class="rows servers" id="list"></ul>
<details id="new"><summary>new server</summary>
<form class="form" id="nform">
<label>name<input name="name" placeholder="a-z, 0-9" maxlength="16" autocapitalize="off" spellcheck="false" required></label>
<label>type<select name="type"><option>fabric</option><option>vanilla</option></select></label>
<label>version<select name="version"></select></label>
<label>memory<select name="memory"></select></label>
<label>port<input name="port" placeholder="auto" inputmode="numeric"></label>
<label>backup<input name="backup" type="time"></label>
<label>restart<input name="restart" type="time" value="04:00"></label>
<label class="b"><input type="checkbox" name="autostart" checked> start on boot</label>
<label class="b"><input type="checkbox" name="public" checked> public stats</label>
<label class="b"><input type="checkbox" name="start" checked> start now</label>
<p class="tools wide"><button>create</button><span id="nstate" class="dim"></span></p>
</form>
</details>
</div>
<p id="msg"></p>
<script src="/static/common.js?v=VERSION"></script>
<script src="/static/dashboard.js?v=VERSION"></script>
</body>
</html>
