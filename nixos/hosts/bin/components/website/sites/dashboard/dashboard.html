<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bin</title>
<link rel="icon" type="image/svg+xml" href="/assets/cat.svg">
<link rel="stylesheet" href="/assets/style.css">
<style>
.dash-wrap{max-width:900px;margin:3rem auto;padding:0 1rem;}
.banner{display:inline-block;padding:.3rem .7rem;margin:0 0 1.5rem;font-size:.85em;border:1px solid var(--line);transition:color .2s,border-color .2s;}
.banner.ok{color:var(--ok);border-color:var(--ok);}
.banner.bad{color:var(--err);border-color:var(--err);}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:.5rem;}
.stat{border:1px solid var(--line);padding:.8rem 1rem;}
.stat .label{font-size:.75em;color:var(--dim);margin-bottom:.4rem;}
.stat .value{font-size:1.3em;}
.bar{background:var(--line);height:.45em;width:100%;margin-top:.5rem;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--acc);transition:width .4s;}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.6rem;margin-bottom:.5rem;}
.chip{border:1px solid var(--line);padding:.6rem .8rem;display:flex;align-items:center;gap:.5rem;font-size:.9em;transition:border-color .2s,color .2s;}
.chip .dot{width:.6em;height:.6em;border-radius:50%;background:var(--dim);flex-shrink:0;transition:background .2s;}
.chip.ok .dot{background:var(--ok);}
.chip.bad{border-color:var(--err);color:var(--err);}
.chip.bad .dot{background:var(--err);}
.chip .name{flex:1;}
.chip .err-count{font-size:.8em;color:var(--err);}
.disks{display:flex;flex-direction:column;gap:.7rem;margin-bottom:.5rem;}
.disk .row1{display:flex;justify-content:space-between;font-size:.9em;margin-bottom:.1rem;}
.disk .row1 .d{color:var(--dim);}
.disk.bad .row1{color:var(--err);}
.storage-row{display:flex;align-items:center;gap:1rem;padding:.5rem 0;border-top:1px solid var(--line);font-size:.9em;}
.storage-row:first-child{border-top:none;}
.storage-row .name{width:6rem;flex-shrink:0;}
.storage-row .path{color:var(--dim);flex:1;font-size:.85em;}
.storage-row .size{width:6rem;text-align:right;flex-shrink:0;}
.storage-row .bar{width:8rem;flex-shrink:0;margin:0;}
.storage-total{font-weight:normal;border-top:1px solid var(--line);padding-top:.6rem;margin-top:.2rem;display:flex;justify-content:space-between;}
.stale{color:var(--err);}
</style>
</head>
<body>
<main class="dash-wrap">
<h1>bin</h1>
<span id="banner" class="banner">checking...</span>
<p id="gen" class="muted">loading...</p>

<h2>load / mem</h2>
<div class="stats">
  <div class="stat"><div class="label">load</div><div class="value" id="load">-</div></div>
  <div class="stat"><div class="label">mem</div><div class="value" id="mem">-</div><div class="bar"><i id="membar" style="width:0%"></i></div></div>
</div>

<h2>services</h2>
<div class="chips" id="services"></div>

<h2>disk</h2>
<div class="disks" id="disk"></div>

<h2>storage per component <span id="genStorage" class="muted" style="font-size:.75em"></span></h2>
<div id="storage"></div>

<script>
function fmtBytes(n){
  if(!n || n<=0) return '0 B';
  const units=['B','KB','MB','GB','TB'];
  let i=0, v=n;
  while(v>=1024 && i<units.length-1){v/=1024;i++;}
  return (i===0 ? v : v.toFixed(v<10?2:1))+' '+units[i];
}

function ago(ts){
  const s=Math.max(0, Math.floor(Date.now()/1000-ts));
  if(s<5) return 'just now';
  if(s<60) return s+'s ago';
  if(s<3600) return Math.floor(s/60)+'m ago';
  return Math.floor(s/3600)+'h ago';
}

let lastStatus=null, lastStorage=null;
let badServices=0, badDisks=0;

function updateBanner(){
  const b=document.getElementById('banner');
  const total=badServices+badDisks;
  if(!lastStatus){
    b.textContent='status unavailable';
    b.className='banner bad';
    return;
  }
  if(total===0){
    b.textContent='all systems normal';
    b.className='banner ok';
    return;
  }
  const parts=[];
  if(badServices) parts.push(badServices+' service'+(badServices>1?'s':'')+' down');
  if(badDisks) parts.push(badDisks+' disk'+(badDisks>1?'s':'')+' almost full');
  b.textContent=parts.join(', ');
  b.className='banner bad';
}

function renderStatus(s){
  lastStatus=s;
  document.getElementById('load').textContent=s.load.join(' / ');
  const pct=Math.round(s.mem.used/s.mem.total*100);
  document.getElementById('mem').textContent=s.mem.used+'mb / '+s.mem.total+'mb';
  document.getElementById('membar').style.width=pct+'%';

  const st=document.getElementById('services');
  st.innerHTML='';
  badServices=0;
  s.services.forEach(x=>{
    const bad = x.active!=='active' || x.failed==='failed' || x.errors>0;
    if(bad) badServices++;
    const chip=document.createElement('div');
    chip.className='chip '+(bad?'bad':'ok');
    chip.innerHTML='<span class="dot"></span><span class="name">'+x.name+'</span>'+
      (x.errors>0?('<span class="err-count">'+x.errors+' err</span>'):'');
    st.appendChild(chip);
  });

  const dk=document.getElementById('disk');
  dk.innerHTML='';
  badDisks=0;
  s.disk.forEach(x=>{
    if(x.pct>85) badDisks++;
    const row=document.createElement('div');
    row.className='disk'+(x.pct>85?' bad':'');
    row.innerHTML='<div class="row1"><span>'+x.path+'</span><span class="d">'+x.used+' / '+x.size+' ('+x.pct+'%)</span></div>'+
      '<div class="bar"><i style="width:'+Math.min(100,x.pct)+'%"></i></div>';
    dk.appendChild(row);
  });

  updateBanner();
}

function renderStorage(d){
  lastStorage=d;
  const sc=document.getElementById('storage');
  sc.innerHTML='';
  const total=d.components.reduce((a,x)=>a+x.bytes,0);
  const max=Math.max(1,...d.components.map(x=>x.bytes));
  d.components.forEach(x=>{
    const pct=Math.round(x.bytes/max*100);
    const row=document.createElement('div');
    row.className='storage-row';
    row.innerHTML='<span class="name">'+x.name+'</span>'+
      '<span class="path">'+x.path+'</span>'+
      '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
      '<span class="size">'+fmtBytes(x.bytes)+'</span>';
    sc.appendChild(row);
  });
  const totalRow=document.createElement('div');
  totalRow.className='storage-total';
  totalRow.innerHTML='<span>total</span><span>'+fmtBytes(total)+'</span>';
  sc.appendChild(totalRow);
}

function tickFreshness(){
  const gen=document.getElementById('gen');
  if(lastStatus){
    const stale = (Date.now()/1000 - lastStatus.generated) > 30;
    gen.textContent='updated '+ago(lastStatus.generated);
    gen.className=stale?'stale':'muted';
  }
  const genStorage=document.getElementById('genStorage');
  if(lastStorage){
    const stale = (Date.now()/1000 - lastStorage.generated) > 600;
    genStorage.textContent='('+ago(lastStorage.generated)+')';
    genStorage.className=stale?'stale':'muted';
  }
  updateBanner();
}

async function load(){
  try{
    const s=await (await fetch('/data/status.json',{cache:'no-store'})).json();
    renderStatus(s);
  }catch(e){
    if(!lastStatus) document.getElementById('gen').textContent='status unavailable';
  }

  try{
    const d=await (await fetch('/data/storage.json',{cache:'no-store'})).json();
    renderStorage(d);
  }catch(e){}

  tickFreshness();
}

load();
setInterval(load,5000);
setInterval(tickFreshness,1000);
</script>
</main>
</body>
</html>
